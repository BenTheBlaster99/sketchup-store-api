[package]
name = "sketchup-store-api"
version = "0.1.0"
description = "SketchLib Laravel API + Filament"

[dependencies]
"php/php" = "=8.3.21"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080", "/app/public/router.php"]
